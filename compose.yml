networks:
    nextcloud:
    postgres:
    proxy:

volumes:
    config:
    database:
    letsencrypt:

services:
    traefik:
        image: traefik:v3.7
        container_name: traefik
        restart: unless-stopped
        command:
            # EntryPoints
            - "--entrypoints.web.address=:80"
            # - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            # - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.tls=true"
            # Let's Encrypt
            - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
            - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
            - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json" # Path inside container volume
            # Optionally make 'letsencrypt' the default resolver for TLS-enabled routers
            - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
            # Providers
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=proxy"
            # API & Dashboard
            - "--api.dashboard=true"
            - "--api.insecure=false"
            # Observability
            - "--log.level=INFO"
            - "--accesslog=true"
        networks:
            - proxy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - letsencrypt:/letsencrypt
        labels:
            traefik.enable: true
            traefik.http.routers.dashboard.rule: "Host(`${DASHBOARD_HOST}`)"
            traefik.http.routers.dashboard.entrypoints: "websecure"
            traefik.http.routers.dashboard.service: "api@internal"
            traefik.http.routers.dashboard.tls: "true"

    redis:
        image: redis:${REDIS_TAG}
        container_name: redis
        restart: unless-stopped
        networks:
            - nextcloud

    postgres:
        image: postgres:${POSTGRES_TAG}
        container_name: ${POSTGRES_CONTAINER_NAME}
        restart: unless-stopped
        networks:
            - postgres
        ports:
            - "${POSTGRES_PORT}:${POSTGRES_PORT}"
        volumes:
            - "${POSTGRES_VOLUME_NAME}:/var/lib/postgresql/"
            - "${BACKUP_PATH}:/mnt/backup"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin4
        restart: unless-stopped
        networks:
            - postgres
            - proxy
        ports:
            - "${PGADMIN_EXPORTED_PORT}:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_USER: ${PGADMIN_DEFAULT_USER}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
            PGADMIN_LISTEN_ADDRESS: ${PGADMIN_LISTEN_ADDRESS}
            PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT}

    cronjobs:
        image: mcuadros/ofelia:latest
        container_name: cronjobs
        restart: unless-stopped
        command: "daemon --docker"
        depends_on:
            - nextcloud
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro

    nextcloud:
        image: nextcloud:${NEXTCLOUD_TAG}
        container_name: ${NEXTCLOUD_CONTAINER_NAME}
        restart: unless-stopped
        networks:
            - postgres
            - proxy
            - nextcloud
        ports:
            - "8080:80"
        volumes:
            - "config:/var/www/html/"
            - "${NEXTCLOUD_DATA_DIR}:/var/www/html/data"
        labels:
            ofelia.enabled: "true"
            ofelia.job-exec.nextcloud.schedule: "@every 5m"
            ofelia.job-exec.nextcloud.command: "runuser -u www-data -- /usr/local/bin/php -f /var/www/html/cron.php"
            traefik.enable: true # Roteamento HTTP/HTTPS para o domínio principal
            traefik.http.routers.nextcloud.rule: Host(`${NEXTCLOUD_DOMAIN}`)
            traefik.http.routers.nextcloud.entrypoints: "websecure"
            traefik.http.routers.nextcloud.tls: true
            traefik.http.services.nextcloud.loadbalancer.server.port: 80 # Middleware para redirecionamento do CalDAV / CardDAV (.well-known)
            traefik.http.routers.nextcloud.middlewares: "nextcloud-redirectregex@docker"
            traefik.http.middlewares.nextcloud-redirectregex.redirectregex.permanent: true
            traefik.http.middlewares.nextcloud-redirectregex.redirectregex.regex: "http://(.*)/\\\\.well-known/(?:card|cal)dav"
            traefik.http.middlewares.nextcloud-redirectregex.redirectregex.replacement: "http://\\$$\\$${1}/remote.php/dav/"
        environment:
            LANG: ${LANG}
            LANGUAGE: ${LANGUAGE}
            LC_ALL: ${LC_ALL}
            NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
            PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
            PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES}
            # OVERWRITEPROTOCOL: ${OVERWRITEPROTOCOL}
            OVERWRITECLIURL: ${OVERWRITECLIURL}
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}

    collabora:
        image: collabora/code:${COLLABORA_TAG}
        container_name: collabora
        restart: unless-stopped
        depends_on:
            - nextcloud
        ports:
            - "9980:9980"
        networks:
            - proxy
            - nextcloud
        cap_add:
            - MKNOD
            - SYS_CHROOT
        environment:
            username: ${COLLABORA_USERNAME}
            password: ${COLLABORA_PASSWORD}
            extra_params: ${COLLABORA_EXTRA_PARAMS}
        labels:
            traefik.enable: true
            traefik.http.routers.collabora.rule: "Host(`${COLLABORA_DOMAIN}`)"
            traefik.http.routers.collabora.entrypoints: "websecure"
            traefik.http.routers.collabora.tls: true
            # Direciona o trafego para a porta interna do container
            traefik.http.routers.collabora.loadbalancer.server.port: 9980

    whiteboard:
        image: ghcr.io/nextcloud-releases/whiteboard:${WHITEBOARD_TAG}
        container_name: whiteboard
        restart: unless-stopped
        depends_on:
            - nextcloud
        networks:
            - nextcloud
            - proxy
        ports:
            - "3002:3002"
        environment:
            NEXTCLOUD_URL: ${OVERWRITECLIURL}
            JWT_SECRET_KEY: ${WHITEBOARD_JWT_SECRET_KEY}
            STORAGE_STRATEGY: "lru"
        labels:
            traefik.enable: true
            traefik.http.routers.whiteboard.rule: "Host(`${NEXTCLOUD_DOMAIN}`) && PathPrefix(`/whiteboard`)"
            traefik.http.routers.whiteboard.entrypoints: "websecure"
            traefik.http.routers.whiteboard.tls: true
            # Redireciona o trafego pra a porta interna do container
            traefik.http.routers.whiteboard.loadbalancer.server.port: 3002
            # Middleware para remover o prefixo /whiteboard antes de enviar para o container
            traefik.http.middlewares.strip-whiteboard.stripprefix.prefixes: "/"
            # Aplica o middleware de remocao do prefixo ao roteador
            traefik.http.routers.whiteboard.middlewares: "strip-whiteboard"

    talk:
        container_name: talk
        image: ghcr.io/nextcloud-releases/aio-talk:latest
        restart: unless-stopped
        init: true
        networks:
            - proxy
        ports:
            - 3478:3478/tcp
            - 3478:3478/udp
            - 8081:8081/tcp
        environment:
            TZ: ${TIME_ZONE}
            NC_DOMAIN: ${NEXTCLOUD_DOMAIN}
            TALK_HOST: ${TALK_SIGNAL_DOMAIN}
            TALK_PORT: 3478
            TURN_SECRET: ${TALK_TURN_SECRET} # this must be a long secretpasswordkey
            SIGNALING_SECRET: ${TALK_SIGNALING_SECRET} # this must be a long secretpasswordkey
            INTERNAL_SECRET: ${TALK_INTERNAL_SECRET} # this must be a long secretpasswordkey
            SKIP_CERT_VERIFY: ${TALK_SKIP_CERT_VERIFY} # true for local self-signed certs; false for CA-issued valid SSL certificates
        labels:
            traefik.enable: true
            traefik.http.routers.talk.rule: "Host(`${TALK_DOMAIN}`)"
            traefik.http.routers.talk.entrypoints: "websecure"
            traefik.http.routers.talk.tls: true
            traefik.http.routers.talk.loadbalancer.server.port: 8081


        # extra_hosts:
        #   - "${NEXTCLOUD_FQDN}:${REVPROXY_IPADDRESS}"
        #   - "${SIGNAL_FQDN}:${REVPROXY_IPADDRESS}"
